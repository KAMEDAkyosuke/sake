name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/test.sh

  build:
    name: Build app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/build-app.sh
